name: Parallel Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # MATRIX EXECUTION: Runs 3 parallel jobs concurrently
  test-matrix:
    name: Test on ${{ matrix.browser }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false # Prevents cancelling other matrix jobs if one fails
      matrix:
        os: [ubuntu-latest]
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Install only the specific browser for this matrix job to save install time
      - name: Install Playwright Browser (${{ matrix.browser }})
        run: npx playwright install ${{ matrix.browser }} --with-deps

      # Run Pytest in parallel using all available CPU cores (-n auto)
      - name: Run Pytest suite in Parallel
        run: pytest -n auto --browser ${{ matrix.browser }} --junitxml=test-results/results-${{ matrix.browser }}.xml

      - name: Publish Test Report
        uses: dorny/test-check@v1
        if: always()
        with:
          name: Pytest Results (${{ matrix.browser }})
          path: test-results/results-${{ matrix.browser }}.xml
          reporter: java-junit

      - name: Upload Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ matrix.browser }}
          path: test-results/
          retention-days: 7