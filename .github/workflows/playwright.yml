name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & Dependencies
        run: npx playwright install --with-deps

      # Run tests, output JUnit XML, and generate Playwright HTML report
      - name: Run Pytest suite
        run: pytest --junitxml=test-results/results.xml --tracing=retain-on-failure

      - name: Publish Test Report
        uses: dorny/test-check@v1
        if: always()
        with:
          name: Pytest Results
          path: test-results/results.xml
          reporter: java-junit

      # Artifact Upload 1: Always upload HTML / Execution Reports
      - name: Upload HTML Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14

      # Artifact Upload 2: Upload screenshots & traces only on failure
      - name: Upload Failure Artifacts (Traces & Screenshots)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: test-results/
          retention-days: 7