name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Grant write permissions so the Action can post reports/checks to the PR and Run Summary
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Check out repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Install Playwright browsers & dependencies
      - name: Install Playwright Browsers & Dependencies
        run: npx playwright install --with-deps

      # 5. Run Pytest and generate JUnit XML report
      - name: Run Pytest suite
        run: pytest --junitxml=test-results/results.xml

      # 6. Publish Test Report to GitHub Actions Summary & Checks
      - name: Publish Test Report
        uses: dorny/test-check@v1
        if: always()
        with:
          name: Pytest Results
          path: test-results/results.xml
          reporter: java-junit

      # 7. Upload failure artifacts (screenshots, traces)
      - name: Upload Test Results Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7